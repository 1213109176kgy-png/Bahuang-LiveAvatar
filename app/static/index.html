<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地实时数字人</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141b;color:#e7edf5;font:16px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:28px auto;padding:0 22px}h1{font-size:26px;margin:0 0 4px}.muted{color:#9ba9bc;font-size:14px}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:20px}.panel{background:#19202b;border:1px solid #2c3748;border-radius:14px;padding:18px}video{width:100%;height:520px;object-fit:contain;background:#070a0e;border-radius:9px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}button{background:#376bea;color:white;border:0;border-radius:7px;padding:11px 16px;font:inherit;cursor:pointer}button.secondary{background:#303c50}button:disabled{opacity:.4;cursor:default}button.active{background:#bd3b49}textarea{width:100%;resize:vertical;min-height:78px;background:#101722;color:#fff;border:1px solid #3a465a;border-radius:8px;padding:12px;font:inherit}#history{height:320px;overflow:auto;white-space:pre-wrap}.bubble{padding:10px 12px;border-radius:8px;margin:10px 0;background:#263145}.bubble.user{background:#233c49}.bubble.error{color:#ffb7bc}#phase{min-height:28px;color:#8bb4ff}.state{display:inline-block;border-radius:20px;background:#253449;padding:4px 12px;font-size:13px;margin:8px 6px 0 0}.good{color:#83dfbc}.bad{color:#ffb7bc}#meter{width:100%;height:5px;background:#303a4d;overflow:hidden;border-radius:10px}#level{height:100%;width:0;background:#7fd9b4}.foot{margin-top:16px}.stats{font-size:13px;color:#a6b6cb}@media(max-width:800px){.layout{grid-template-columns:1fr}video{height:380px}}
</style>
<main>
<h1>本地实时数字人</h1>
<div class="muted">Qwen3 · 中文语音 · Wav2Lip 口型同步</div>
<div id="states">正在检查服务…</div>
<div class="layout">
<section class="panel"><video id="avatar" autoplay playsinline></video><div class="controls"><button id="connect">连接数字人</button><button id="disconnect" class="secondary" disabled>断开</button><button id="interrupt" class="secondary">打断说话</button></div><div id="videoStatus" class="stats">请先连接数字人，再发送文字或打开麦克风。</div></section>
<section class="panel"><div id="history"><div class="muted">先发送一句文字测试，再开始语音对话。首次模型加载需要一些时间。</div></div><div id="phase"></div><textarea id="text" placeholder="输入一句话，例如：你好，介绍一下自己。"></textarea><div class="controls"><button id="send">发送</button><button id="microphone" class="secondary">开启麦克风</button><button id="clear" class="secondary">清空对话</button></div><div id="meter"><div id="level"></div></div><div class="muted foot">开启麦克风后，停顿约 0.8 秒会自动发送。播放回答期间暂停收音；需要插话时先点“打断说话”。耳机可减少回声。</div><div id="timing" class="stats foot"></div></section>
</div></main>
<script src="/static/client.js"></script>
</html>
